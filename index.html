<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="An animated interactive solar system with NASA Eyes." />

    <title>Interactive Solar System</title>

    <link rel="stylesheet" href="./css.css" />

    <link rel="stylesheet" href="./responsive.css" />
  </head>

  <body>
    <!-- =====================================================
         SPACE BACKGROUND
    ====================================================== -->

    <div class="space-effects" aria-hidden="true">
      <div class="stars stars-back"></div>

      <div class="stars stars-mid"></div>

      <div class="stars stars-front"></div>

      <div id="meteors"></div>
    </div>

    <!-- =====================================================
         SOLAR SYSTEM
    ====================================================== -->

    <main class="solar-system" aria-label="Interactive solar system">
      <!-- =================================================
             SUN
        ================================================== -->

      <a class="sun planet-link" href="#" aria-label="Explore the Sun with NASA Eyes" data-planet="sun" data-name="Sun"></a>

      <!-- =================================================
             MERCURY
        ================================================== -->

      <div class="orbit orbit-mercury">
        <a class="planet mercury" href="#" aria-label="Explore Mercury with NASA Eyes" data-planet="mercury" data-name="Mercury"></a>
      </div>

      <!-- =================================================
             VENUS
        ================================================== -->

      <div class="orbit orbit-venus">
        <a class="planet venus" href="#" aria-label="Explore Venus with NASA Eyes" data-planet="venus" data-name="Venus"></a>
      </div>

      <!-- =================================================
             EARTH
        ================================================== -->

      <div class="orbit orbit-earth">
        <a class="planet earth" href="#" aria-label="Explore Earth with NASA Eyes" data-planet="earth" data-name="Earth">
          <span class="moon-orbit" aria-hidden="true">
            <span class="moon"></span>
          </span>
        </a>
      </div>

      <!-- =================================================
             MARS
        ================================================== -->

      <div class="orbit orbit-mars">
        <a class="planet mars" href="#" aria-label="Explore Mars with NASA Eyes" data-planet="mars" data-name="Mars"></a>
      </div>

      <!-- =================================================
             JUPITER
        ================================================== -->

      <div class="orbit orbit-jupiter">
        <a class="planet jupiter" href="#" aria-label="Explore Jupiter with NASA Eyes" data-planet="jupiter" data-name="Jupiter"></a>
      </div>

      <!-- =================================================
             SATURN
        ================================================== -->

      <div class="orbit orbit-saturn">
        <a class="planet saturn" href="#" aria-label="Explore Saturn with NASA Eyes" data-planet="saturn" data-name="Saturn">
          <span class="rings" aria-hidden="true"></span>
        </a>
      </div>

      <!-- =================================================
             URANUS
        ================================================== -->

      <div class="orbit orbit-uranus">
        <a class="planet uranus" href="#" aria-label="Explore Uranus with NASA Eyes" data-planet="uranus" data-name="Uranus"></a>
      </div>

      <!-- =================================================
             NEPTUNE
        ================================================== -->

      <div class="orbit orbit-neptune">
        <a class="planet neptune" href="#" aria-label="Explore Neptune with NASA Eyes" data-planet="neptune" data-name="Neptune"></a>
      </div>
    </main>

    <!-- =====================================================
         HINT
    ====================================================== -->

    <div class="hint" aria-hidden="true">Click a planet or the Sun to explore it with NASA Eyes</div>

    <!-- =====================================================
         NASA EYES MODAL
    ====================================================== -->

    <div class="nasa-modal" id="nasaModal" aria-hidden="true">
      <!-- BACKDROP -->

      <div class="nasa-modal-backdrop" data-close-nasa></div>

      <!-- MODAL -->

      <section class="nasa-modal-content" role="dialog" aria-modal="true" aria-labelledby="nasaModalTitle">
        <!-- HEADER -->

        <header class="nasa-modal-header">
          <h2 id="nasaModalTitle">NASA Eyes</h2>

          <button type="button" class="nasa-modal-close" id="nasaModalClose" aria-label="Close NASA Eyes">&times;</button>
        </header>

        <!-- IFRAME -->

        <div class="nasa-iframe-container">
          <div class="nasa-loading" id="nasaLoading">Loading NASA Eyes...</div>

          <iframe id="nasaIframe" title="NASA Eyes Solar System" src="about:blank" allow="fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
        </div>
      </section>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js.js"></script>
  </body>
</html>
